  <script>const serviceWorkerVersion = null;</script>
  <script src="flutter.js" defer></script>

  <style>
    /* Full-screen splash */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    /* Match Flutter splash size (≈300x300 responsive) */
    #splash-logo {
      width: min(40vw, 300px);
      height: min(40vw, 300px);
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadein 1.5s ease-in-out infinite alternate;
    }

    #splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #progress-container {
      width: 250px;
      height: 10px;
      background: #eee;
      border-radius: 5px;
      margin-top: 20px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #61B3CA; /* Your Flutter theme color */
      transition: width 0.2s ease;
    }

    #progress-text {
      margin-top: 10px;
      color: grey;
      font-size: 16px;
    }

    @keyframes fadein {
      from { opacity: 0.5; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-logo">
      <img src="ph-logo-transperant-bg-01.png" alt="Logo" />
    </div>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Loading... 0%</div>
  </div>

  <script>
    let progress = 0;
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    // Fake progress until Flutter is ready
    const interval = setInterval(() => {
      if (progress < 90) { // stop at 90% until Flutter loads
        progress += 1;
        progressBar.style.width = progress + "%";
        progressText.innerText = "Loading... " + progress + "%";
      }
    }, 80); // adjust speed

    // Load Flutter app
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();

            // When Flutter paints first frame → complete progress
            window.addEventListener('flutter-first-frame', function () {
              clearInterval(interval);
              progress = 100;
              progressBar.style.width = "100%";
              progressText.innerText = "Loading... 100%";

              // Fade out splash
              const splash = document.getElementById('splash');
              splash.style.transition = "opacity 0.5s ease";
              splash.style.opacity = "0";
              setTimeout(() => splash.remove(), 600);
            });
          });
        }
      });
    });
  </script>
