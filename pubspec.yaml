name: hotelmanagementapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.36+44

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.2.0

  # Firebase - Latest compatible versions
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_database: ^12.0.0
  # google_sign_in: ^7.1.1

  after_layout: ^1.2.0
  get: ^4.7.2
  connectivity_plus: ^6.1.4
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.3
  flutter_colorful_tab: ^0.1.1

  video_player: ^2.9.2
  flutter_cache_manager: ^3.4.1
  encrypt: ^5.0.3
  just_audio: ^0.10.4
  speech_to_text: ^7.3.0
  auto_size_text: ^3.0.0
  number_to_words_english: ^3.0.4
  permission_handler: ^12.0.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  package_info_plus: ^8.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  device_info_plus: ^11.5.0
  syncfusion_flutter_pdfviewer: ^30.2.5
  android_id: ^0.4.0
  youtube_player_flutter: ^9.1.2
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.4.2
  flutter_html: ^3.0.0-beta.2
  fluttertoast: ^8.2.8
  toast: ^0.3.0
  lib: ^0.2.1
  firebase_storage: ^13.0.0
  webview_flutter_web: ^0.2.3+4
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/appicon2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/profileImage.svg
    - assets/
    - assets/search-normal.svg
    - assets/images/interaction.png
    - assets/images/faq.png
    - assets/images/approval.png
    - assets/images/round_play.png
    - assets/images/bottomIS.png
    - assets/images/AR_workersComp.png
    - assets/images/
    - assets/language_lab.png
    - assets/app icon.png 

  fonts:
    - family: Varela
      fonts:
        - asset: assets/font/varela.ttf
    - family: Symbola
      fonts:
        - asset: assets/font/symbola.ttf
    - family: Lucida
      fonts:
        - asset: assets/font/lucida-sans-unicode.ttf
    - family: Kaushan
      fonts:
        - asset: assets/font/KaushanScript-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/font/Quicksand-VariableFont_wght.ttf
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 500
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Thin.ttf
          weight: 400
