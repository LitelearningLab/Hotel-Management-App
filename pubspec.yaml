name: hotelmanagementapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.22+30

environment:
  sdk: '>=3.3.0 <3.4.0'  # Stay within Dart 3.3.x since you can't use 3.4.0+

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9         # ✅ Compatible with Dart 3.3.4 and http 0.13.x
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  # flutter_inappwebview: ^5.7.2+3
  after_layout: ^1.2.0
  get: ^4.7.2
  connectivity_plus: ^6.1.4
  google_sign_in: ^6.2.2
  firebase_auth: ^5.2.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.3
  flutter_colorful_tab: ^0.1.1
  firebase_database: ^11.1.1
  video_player: ^2.9.2
  flutter_cache_manager: ^3.3.1
  encrypt: ^5.0.3
  just_audio: ^0.9.42
  speech_to_text: ^6.1.1
  auto_size_text: ^3.0.0
  number_to_words_english: ^2.1.1
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  google_fonts: ^4.0.3         # ✅ Uses http ^0.13.x
  intl: ^0.17.0                # ✅ Compatible with Syncfusion <28
  device_info_plus: ^8.1.0     # ✅ Compatible with Syncfusion <22.1.34
  syncfusion_flutter_pdfviewer: ^21.1.56   # ✅ Compatible with all above
  android_id: ^0.4.0
  youtube_player_flutter: ^8.1.2
  flutter_inappwebview: ^5.7.2+3
  webview_flutter: ^4.4.2
  flutter_html: ^3.0.0-beta.2
  fluttertoast: ^8.2.8
  toast: ^0.3.0
  lib: ^0.0.3
  # pdf_render: ^1.4.12
  # dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/appicon2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/profileImage.svg
    - assets/
    - assets/search-normal.svg
    - assets/images/interaction.png
    - assets/images/faq.png
    - assets/images/approval.png
    - assets/images/round_play.png
    - assets/images/bottomIS.png
    - assets/images/AR_workersComp.png
    - assets/images/
    - assets/language_lab.png
    - assets/app icon.png 

  fonts:
    - family: Varela
      fonts:
        - asset: assets/font/varela.ttf
    - family: Symbola
      fonts:
        - asset: assets/font/symbola.ttf
    - family: Lucida
      fonts:
        - asset: assets/font/lucida-sans-unicode.ttf
    - family: Kaushan
      fonts:
        - asset: assets/font/KaushanScript-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/font/Quicksand-VariableFont_wght.ttf
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 500
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Thin.ttf
          weight: 400
